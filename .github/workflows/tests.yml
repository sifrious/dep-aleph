name: package-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-test:
    runs-on: ubuntu-latest
    name: package-test

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Remove local path repository override
        run: |
          php -r '
            $composer = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
            unset($composer["repositories"]);
            unset($composer["require"]["sifrious/funes"]);
            file_put_contents(
              "composer.json",
              json_encode($composer, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR).PHP_EOL
            );
          '

      - run: composer update --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/pest tests/Feature/YouTubeIngestionTest.php
