name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-test:
    runs-on: ubuntu-latest
    name: package-test

    steps:
      - uses: actions/checkout@v5

      - name: Clone sibling Funes package
        run: git clone --depth 1 https://github.com/sifrious/dep-funes.git ../Funes

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer update --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/pest

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v5

      - name: Clone sibling Funes package
        run: git clone --depth 1 https://github.com/sifrious/dep-funes.git ../Funes

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer update --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/pest

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Clone sibling Funes package
        run: git clone --depth 1 https://github.com/sifrious/dep-funes.git ../Funes

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer update --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/pint --test

      - run: vendor/bin/phpstan analyse
