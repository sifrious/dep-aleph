name: package-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-test:
    runs-on: ubuntu-latest
    name: package-test

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: composer update --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/pest tests/Feature/YouTubeIngestionTest.php tests/Feature/LocalVideoIngestionTest.php tests/Feature/PodcastIngestionTest.php tests/Feature/PodcastEnclosureDownloaderTest.php tests/Feature/ScoreTabIngestionTest.php tests/Feature/MidiIngestionTest.php tests/Unit/OursSmfMidiParserTest.php tests/Feature/HandwritingIngestionTest.php tests/Feature/ImageIngestionTest.php tests/Feature/AppleMailIngestionTest.php tests/Feature/GoogleDriveIngestionTest.php tests/Feature/HistoricalAssertionNormalizationTest.php tests/Feature/BibliographicCatalogTest.php tests/Unit/GoogleDriveExportPlanTest.php tests/Unit/ProvenancePrimitivesTest.php
